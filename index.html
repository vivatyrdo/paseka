<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f1">
  <meta name="description" content="Голосовой журнал пасеки">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Пасечный журнал</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#top"><b>Пасечный журнал</b></a>
      <div class="top-actions">
        <span class="sync-state" id="connection" role="status"><i></i><span>Проверяем связь</span></span>
        <button class="settings-button" id="open-settings" aria-label="Настройки Groq">⚙</button>
      </div>
    </header>

    <main id="top">
      <section class="voice-actions" aria-label="Голосовые действия">
        <button class="voice-button voice-note" id="record-note" aria-pressed="false">
          <span class="voice-dot" aria-hidden="true"></span>
          <span class="voice-label" id="record-label">Записать в журнал</span>
          <span class="voice-timer" id="record-time"></span>
        </button>
        <button class="voice-button voice-ask" id="record-question" aria-pressed="false">
          <span class="voice-dot" aria-hidden="true"></span>
          <span class="voice-label" id="question-label">Спросить журнал</span>
          <span class="voice-timer" id="question-time"></span>
        </button>
      </section>

      <section class="apiary-section" aria-labelledby="apiary-title">
        <div class="section-heading">
          <h1 id="apiary-title">Пасека</h1>
          <span class="entity-count" id="entity-count"></span>
        </div>
        <div class="apiary-tabs" role="tablist" aria-label="Тип объектов">
          <button class="tab active" type="button" data-type="family" role="tab" aria-selected="true">Семьи</button>
          <button class="tab" type="button" data-type="nucleus" role="tab" aria-selected="false">Отводки</button>
        </div>
        <div class="list-controls">
          <div class="task-filters" role="group" aria-label="Фильтр заданий">
            <button class="filter-chip active" type="button" data-filter="all">Все</button>
            <button class="filter-chip" type="button" data-filter="open">С задачами</button>
            <button class="filter-chip" type="button" data-filter="clear">Без задач</button>
          </div>
        </div>
        <div class="entity-list" id="entities" aria-live="polite"></div>
      </section>

    </main>
  </div>

  <dialog id="input-dialog" class="input-dialog" aria-labelledby="input-title">
    <div class="input-panel">
      <div class="dialog-head"><h2 id="input-title">Новая запись</h2><button class="settings-close" id="input-close" type="button" aria-label="Закрыть">×</button></div>
      <div id="input-methods" class="input-methods">
        <button class="input-method" id="choose-voice" type="button"><span class="method-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="18" y="5" width="12" height="25" rx="6"/><path d="M12 22v2a12 12 0 0 0 24 0v-2M24 36v7m-8 0h16"/></svg></span><span>Голосом</span></button>
        <button class="input-method" id="choose-text" type="button"><span class="method-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="4" y="9" width="40" height="30" rx="4"/><path d="M10 17h2m6 0h2m6 0h2m6 0h2m6 0h2M10 24h2m6 0h2m6 0h2m6 0h2m6 0h2M10 31h14m4 0h10"/></svg></span><span>Текстом</span></button>
      </div>
      <div id="input-editor" hidden>
        <p class="input-status" id="input-status" aria-live="polite">Проверьте текст перед отправкой</p>
        <textarea id="input-text" rows="6" placeholder="Текст записи или вопрос…"></textarea>
        <p class="record-status" id="record-status" hidden>● Идёт запись · <span id="input-timer">00:00</span></p>
        <div class="input-controls"><button class="input-back" id="input-back" type="button">Назад</button><button class="save-settings" id="input-send" type="button">Отправить</button></div>
      </div>
      <div id="input-result" class="input-result" hidden aria-live="polite"></div>
    </div>
  </dialog>

  <dialog id="settings-dialog">
    <form method="dialog" class="settings-panel">
      <div class="dialog-head">
        <h2>Ключи Groq</h2>
        <button class="settings-close" type="button" aria-label="Закрыть">×</button>
      </div>
      <label class="key-label">Основной ключ · GPT-OSS 120B<input id="api-key-1" type="password" autocomplete="off"></label>
      <label class="key-label">Резервный ключ · GPT-OSS 20B<input id="api-key-2" type="password" autocomplete="off"></label>
      <button class="save-settings" id="save-settings" type="button">Сохранить</button>
      <p id="settings-status" class="settings-status" role="status"></p>
    </form>
  </dialog>
  <dialog id="entity-actions-dialog">
    <div class="settings-panel">
      <div class="dialog-head"><h2 id="entity-action-title">Объект</h2><button class="settings-close" data-close-actions aria-label="Закрыть">×</button></div>
      <button class="save-settings" id="edit-entity">Основная информация</button>
      <button class="delete-entity" id="delete-entity">Удалить</button>
    </div>
  </dialog>
  <dialog id="entity-edit-dialog">
    <form class="settings-panel" id="entity-edit-form">
      <div class="dialog-head"><h2 id="entity-edit-title">Изменить объект</h2><button class="settings-close" type="button" data-close-edit aria-label="Закрыть">×</button></div>
      <label class="key-label" for="edit-entity-type">Тип<select id="edit-entity-type"><option value="family">Семья</option><option value="nucleus">Отводок</option></select></label>
      <label class="key-label" for="edit-entity-number">Номер<input id="edit-entity-number" type="number" min="1" max="9999" inputmode="numeric"></label>
      <label class="key-label" for="edit-queen-year">Год матки<input id="edit-queen-year" type="number" min="1900" max="2100" inputmode="numeric"></label>
      <label class="key-label" for="edit-strength">Сила семьи<input id="edit-strength" type="text"></label>
      <label class="key-label" for="edit-feed">Корм<input id="edit-feed" type="text"></label>
      <label class="key-label" for="edit-frame-count">Количество рамок<input id="edit-frame-count" type="number" min="1" max="100" inputmode="numeric"></label>
      <button class="save-settings" type="submit">Сохранить</button>
    </form>
  </dialog>
  <dialog id="history-edit-dialog">
    <form class="settings-panel" id="history-edit-form">
      <div class="dialog-head"><h2>Изменить запись</h2><button class="settings-close" type="button" data-close-history aria-label="Закрыть">×</button></div>
      <p class="history-edit-date" id="history-edit-date"></p>
      <label class="key-label" for="history-edit-text">Текст записи<textarea id="history-edit-text" rows="7" required></textarea></label>
      <button class="save-settings" type="submit">Сохранить запись</button>
      <button class="delete-entity" id="delete-history" type="button">Удалить запись</button>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js" defer></script>
</body>
</html>
